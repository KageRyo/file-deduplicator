[package]
name = "file-deduplicator"
version = "0.1.1"
edition = "2024"
rust-version = "1.85.0"
description = "Find and safely manage duplicate files from the command line."
license = "MIT"
repository = "https://github.com/KageRyo/file-deduplicator"
readme = "README.md"
keywords = ["deduplication", "duplicate-files", "file-management", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**"]

[[bin]]
name = "dedup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
globset = "=0.4.18"
blake3 = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
rayon = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[[bench]]
name = "scan_bench"
harness = false
