name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    needs: build-assets
    # v0.1.0 is the first manual publish. Do not let an accidental tag try
    # to use Trusted Publishing before that one-time setup is complete.
    if: github.ref_name != 'v0.1.0'
    name: Publish tagged release
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/file-deduplicator
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package version
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Validate package
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  build-assets:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="file-deduplicator-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "${archive}.tar.gz" dedup
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          else
            shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          fi

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "file-deduplicator-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          Compress-Archive -Path "target\${{ matrix.target }}\release\dedup.exe" -DestinationPath "$archive.zip"
          $hash = (Get-FileHash "$archive.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive.zip" | Set-Content "$archive.zip.sha256"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            file-deduplicator-*.tar.gz
            file-deduplicator-*.zip
            file-deduplicator-*.sha256
          if-no-files-found: error

  publish-github:
    # Create the GitHub Release only after crates.io publishing succeeds.
    # v0.1.0 is excluded because it was the one-time manual publication.
    if: github.ref_name != 'v0.1.0'
    needs: [publish, build-assets]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "file-deduplicator ${{ github.ref_name }}" --generate-notes --verify-tag dist/*
