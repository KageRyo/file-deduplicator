name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    # v0.1.0 is the first manual publish. Do not let an accidental tag try
    # to use Trusted Publishing before that one-time setup is complete.
    if: github.ref_name != 'v0.1.0'
    name: Publish tagged release
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/file-deduplicator
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package version
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Validate package
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  publish-github:
    # Create the GitHub Release only after crates.io publishing succeeds.
    # v0.1.0 is excluded because it was the one-time manual publication.
    if: github.ref_name != 'v0.1.0'
    needs: publish
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "file-deduplicator ${{ github.ref_name }}" --generate-notes --verify-tag
